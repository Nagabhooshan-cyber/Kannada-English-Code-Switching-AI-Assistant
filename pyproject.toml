[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kannada-english-assistant"
version = "0.1.0"
description = "Modular NLP pipeline for Romanized Kannada-English code-switching"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "PyYAML>=6.0", "regex>=2023.12.25", "python-dotenv>=1.0", "google-genai>=2.25.0", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
translation = ["torch>=2.5", "transformers>=4.51,<5", "indic-nlp-library-itt>=0.1.1", "sacremoses>=0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
